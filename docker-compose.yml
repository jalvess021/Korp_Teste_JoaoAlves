services:

  postgres:
    image: postgres:16-alpine
    container_name: korp-postgres
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5


  estoque:
    build:
      context: ./estoque
    container_name: korp-estoque
    ports:
      - "${ESTOQUE_PORT:-5002}:${ESTOQUE_PORT:-5002}"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy


  faturamento:
    build:
      context: ./faturamento
    container_name: korp-faturamento
    ports:
      - "${FATURAMENTO_PORT:-5001}:${FATURAMENTO_PORT:-5001}"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy


  frontend:
    build:
      context: ./frontend
    container_name: korp-frontendy
    ports:
      - "${FRONTEND_PORT:-4200}:80"
    environment:
      - ESTOQUE_HOST=estoque
      - FATURAMENTO_HOST=faturamento
      - ESTOQUE_PORT=${ESTOQUE_PORT:-5002}
      - FATURAMENTO_PORT=${FATURAMENTO_PORT:-5001}
    depends_on:
      - estoque
      - faturamento

volumes:
  pgdata: