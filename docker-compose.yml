services:

  postgres:
    image: postgres:16-alpine
    container_name: korp_postgres
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - korp_net

  estoque:
    build:
      context: ./estoque
      dockerfile: Dockerfile
    container_name: korp_estoque
    ports:
      - "${ESTOQUE_PORT}:5002"
    env_file:
      - .env
    depends_on:
      - postgres
    networks:
      - korp_net


  faturamento:
    build:
      context: ./faturamento
      dockerfile: Dockerfile
    container_name: korp_faturamento
    ports:
      - "${FATURAMENTO_PORT}:5001"
    env_file:
      - .env
    depends_on:
      - postgres
    networks:
      - korp_net

  frontend:
    build: ./frontend
    container_name: korp_frontend
    ports:
      - "${FRONTEND_PORT}:4200"
    depends_on:
      - faturamento
      - estoque
    networks:
      - korp_net


volumes:
  pgdata:

networks:
  korp_net:
    driver: bridge