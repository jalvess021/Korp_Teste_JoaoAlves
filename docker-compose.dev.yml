services:

  postgres:
    image: postgres:16-alpine
    container_name: korp_postgres_dev
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - korp_net


  rabbitmq:
    image: rabbitmq:3-management
    container_name: korp_rabbit_dev
    ports:
      - "${RABBITMQ_PORT}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT}:15672"
    networks:
      - korp_net


  estoque:
    image: golang:1.25-alpine
    container_name: korp_estoque_dev
    working_dir: /app
    volumes:
      - ./estoque:/app
    command: sh -c "go install github.com/air-verse/air@latest && air"
    ports:
      - "${ESTOQUE_PORT}:5002"
    env_file:
      - .env
    depends_on:
      - postgres
    networks:
      - korp_net

volumes:
  pgdata:

networks:
  korp_net:
    driver: bridge